name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check every script parses
        shell: bash
        run: for f in $(find src test -name '*.js'); do node --check "$f"; done

      - name: Unit tests
        run: npm test

      # Starts the real overlay, drives it over its command channel and renders every hero move set.
      # Windows and macOS runners have a desktop; Linux needs a virtual one.
      - name: End-to-end test (Windows, macOS)
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: End-to-end test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:e2e

  package:
    name: Package for ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: dist:win
            files: dist/*.exe
          - name: macOS
            os: macos-latest
            script: dist:mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # only used to attach the installers to a release on a v* tag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the installer
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: spidey-hang-${{ matrix.name }}
          path: ${{ matrix.files }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.files }} --clobber || gh release create "$GITHUB_REF_NAME" ${{ matrix.files }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
