name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  vsix:
    runs-on: windows-latest
    permissions:
      contents: write # only used to attach the .vsix to a release on a v* tag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check the extension scripts parse
        shell: bash
        run: |
          node --check extension.js
          node --check media/hang.js

      - name: Build the desktop app and pack the .vsix
        run: python scripts/build-vsix.py

      - uses: actions/upload-artifact@v4
        with:
          name: spidey-hang-vsix
          path: dist/*.vsix

      - name: Attach the .vsix to a release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/*.vsix --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
